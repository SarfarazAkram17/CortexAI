name: Keep Render Services Warm

on:
  schedule:
    # Runs every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allows manual trigger from the Actions tab for testing

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping gateway
        run: curl -s -o /dev/null -w "gateway: %{http_code}\n" https://gateway-l239.onrender.com --max-time 60 || echo "gateway: failed/waking up"

      - name: Ping auth-service
        run: curl -s -o /dev/null -w "auth-service: %{http_code}\n" https://auth-service-n35n.onrender.com --max-time 60 || echo "auth-service: failed/waking up"

      - name: Ping chat-service
        run: curl -s -o /dev/null -w "chat-service: %{http_code}\n" https://chat-service-wdt2.onrender.com --max-time 60 || echo "chat-service: failed/waking up"

      - name: Ping agent-service
        run: curl -s -o /dev/null -w "agent-service: %{http_code}\n" https://agent-service-ng7z.onrender.com --max-time 60 || echo "agent-service: failed/waking up"

      - name: Ping billing-service
        run: curl -s -o /dev/null -w "billing-service: %{http_code}\n" https://billing-service-50y9.onrender.com --max-time 60 || echo "billing-service: failed/waking up"